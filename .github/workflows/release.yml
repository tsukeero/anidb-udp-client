name: Release

on:
  push:
    branches: [ main ]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # npm trusted publishing (OIDC): no token, provenance attached automatically.
  # Trusted publisher on npmjs.com must point at this repository and workflow file (release.yml).
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # node 26 bundles npm >= 11.5.1, required for trusted publishing
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm publish

  docs:
    needs: [ release-please, publish ]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
